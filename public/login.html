<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="same-origin" />
  <title>乡芽 · 登录</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='24' font-size='24'%3E🌱%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --green: #2E7D32;
      --green-d: #1B5E20;
      --green-l: #E8F5E9;
      --orange: #E8844A;
      --ink: #2B2B2B;
      --muted: #8A8A8A;
      --line: #E8E6E1;
      --bg: #F7F6F2;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #F0F7EE 0%, #FDF6EE 55%, #F7F6F2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
    }
    .login-card {
      width: 400px;
      max-width: calc(100vw - 32px);
      background: #fff;
      border-radius: 20px;
      border: 1px solid var(--line);
      box-shadow: 0 12px 40px rgba(43, 43, 43, .08);
      padding: 40px 36px 32px;
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .brand .logo {
      width: 42px; height: 42px; border-radius: 12px;
      background: linear-gradient(135deg, var(--green), #66BB6A);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; color: #fff;
    }
    .brand .t1 { font-size: 22px; font-weight: 800; }
    .brand .t2 { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .sub { font-size: 13px; color: var(--muted); margin: 6px 0 26px; line-height: 1.6; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .field input {
      width: 100%; padding: 11px 14px; border-radius: 10px;
      border: 1px solid var(--line); font-size: 15px; outline: none;
      background: #FBFBFA; transition: border .2s;
    }
    .field input:focus { border-color: var(--green); background: #fff; }
    .field .err { font-size: 12px; color: #D32F2F; margin-top: 5px; min-height: 14px; }
    .captcha-row { display: flex; gap: 10px; }
    .captcha-row input { flex: 1; }
    .captcha-box {
      width: 120px; height: 44px; border-radius: 10px; border: 1px solid var(--line);
      background: #F4F3EF; overflow: hidden; cursor: pointer; flex-shrink: 0;
    }
    .captcha-box svg { width: 100%; height: 100%; display: block; }
    .btn {
      width: 100%; padding: 13px; border: none; border-radius: 12px;
      background: linear-gradient(135deg, var(--green), #43A047);
      color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
      margin-top: 8px; transition: opacity .2s;
    }
    .btn:hover { opacity: .92; }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .tips { margin-top: 22px; font-size: 12px; color: var(--muted); line-height: 1.9; }
    .tips b { color: #555; }
    .switch { margin-top: 14px; font-size: 12px; color: var(--muted); text-align: center; }
    .switch a { color: var(--green); text-decoration: none; margin: 0 6px; }
    .toast {
      position: fixed; left: 50%; top: 28px; transform: translateX(-50%);
      background: #333; color: #fff; padding: 10px 20px; border-radius: 10px;
      font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 99;
      max-width: calc(100vw - 40px);
    }
    .toast.on { opacity: 1; }
  </style>
</head>
<body>
  <div class="toast" id="toast"></div>
  <div class="login-card">
    <div class="brand">
      <div class="logo">🌱</div>
      <div>
        <div class="t1">乡芽 · 乡镇教育智能体</div>
        <div class="t2">让每一个乡镇孩子，都被看见</div>
      </div>
    </div>
    <div class="sub">教师 / 学生 / 家长 / 教育管理者 统一入口</div>
    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="username">用户名</label>
        <input id="username" name="username" maxlength="64" placeholder="请输入用户名" />
        <div class="err" id="err-username"></div>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" maxlength="128" placeholder="请输入密码" />
        <div class="err" id="err-password"></div>
      </div>
      <div class="field" id="captchaField" style="display:none">
        <label for="captcha">验证码</label>
        <div class="captcha-row">
          <input id="captcha" name="captcha" maxlength="8" placeholder="计算结果" autocomplete="off" />
          <div class="captcha-box" id="captchaBox" title="点击刷新"></div>
        </div>
        <div class="err" id="err-captcha"></div>
      </div>
      <button class="btn" id="submitBtn" type="submit">登 录</button>
    </form>
    <div class="tips">
      演示环境账号请向管理员索取；生产环境请勿使用默认密码。
    </div>
    <div class="switch">
      直接进入 <a href="teacher.html">教师端</a><a href="student.html">学生端</a><a href="parent.html">家长端</a><a href="admin.html">管理端</a>
    </div>
  </div>
  <script type="module" src="/assets/app/login-main.js"></script>
</body>
</html>
